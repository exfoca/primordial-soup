[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "primordial_soup"
dynamic = ["version"]
requires-python = ">=3.12"
license = "MIT"
dependencies = ["numpy", "pygame", "Pillow"]

[project.optional-dependencies]
# Recording to animated GIF is an OPTIONAL feature: the codebase
# imports Pillow lazily (see recording.py and rendering.draw), so a
# user who never presses G does not need Pillow installed. Installing
# with `pip install .[recording]` pulls it in.
recording = ["Pillow"]

[tool.setuptools.dynamic]
version = {attr = "primordial_soup._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["primordial_soup*"]

[tool.setuptools.package-data]
# Recursos graficos/sonoros sao carregados por caminho relativo ao
# pacote. Sem esta declaracao, `pip install .` nao os inclui no wheel.
primordial_soup = ["icon.png", "sounds/*.wav"]
